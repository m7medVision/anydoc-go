[package]
name = "anydoc-ffi"
version = "0.2.4"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "C ABI for Go bindings to anydoc 0.2.4"

[lib]
name = "anydoc_ffi"
crate-type = ["staticlib"]

[dependencies]
anydoc = "=0.2.4"
pdf-inspector = "=1.19.0"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Shrinks the static archive (~52 MB -> ~21 MB before stripping). `panic`
# must stay "unwind": every FFI entry point in src/lib.rs relies on
# catch_unwind, which "abort" would defeat.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = false
panic = "unwind"
