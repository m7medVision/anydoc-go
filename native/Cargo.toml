[package]
name = "anydoc-ffi"
version = "0.2.4"
edition = "2021"
publish = false
license = "MIT"
description = "C ABI for Go bindings to anydoc 0.2.4"

[lib]
name = "anydoc_ffi"
crate-type = ["staticlib"]

[dependencies]
anydoc = "=0.2.4"
pdf-inspector = "=1.14.2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
