[package]
name = "anydoc-ffi"
version = "0.2.4"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "C ABI for Go bindings to anydoc 0.2.4 (pdf-inspector pinned to a fork with layout fixes)"

[lib]
name = "anydoc_ffi"
crate-type = ["staticlib"]

[dependencies]
anydoc = "=0.2.4"
pdf-inspector = "1.19"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# anydoc also depends on pdf-inspector; patching crates.io (rather than pointing
# only the direct dependency at git) makes both resolve to this single copy.
[patch.crates-io]
pdf-inspector = { git = "https://github.com/m7medVision/pdf-inspector", rev = "b30fee8de023c9908b123dfe0f835d64e982117d" }

# Shrinks the static archive (~52 MB -> ~21 MB before stripping). `panic`
# must stay "unwind": every FFI entry point in src/lib.rs relies on
# catch_unwind, which "abort" would defeat.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = false
panic = "unwind"
